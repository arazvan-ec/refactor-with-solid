# config/services.yaml
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

        bind:
            $extension: '%env(URL_ENV)%'
            $thumborServerUrl: '%env(THUMBOR_SERVER_URL)%'
            $thumborSecret: '%env(THUMBOR_SECRET_KEY)%'
            $awsBucket: '%env(STATICS_AWS_BUCKET)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Orchestrator'
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Controller/V1/'
            - '../src/Ec/Snaapi/Infrastructure/'
            - '../src/Application/DataTransformer/Apps/Body/'
            - '../src/Application/DataTransformer/Apps/Media/DataTransformers/'

    # Interface bindings for SOLID refactoring
    App\Infrastructure\Service\MultimediaServiceInterface: '@App\Infrastructure\Service\MultimediaService'
    App\Infrastructure\Service\UrlGeneratorServiceInterface: '@App\Infrastructure\Service\UrlGeneratorService'
    Snaapi\Infrastructure\Service\Image\ImageProcessorInterface: '@App\Infrastructure\Service\Thumbor'
    Snaapi\Infrastructure\Service\Image\ImageSizeConfigurationInterface: '@App\Infrastructure\Service\Image\DefaultImageSizeConfiguration'

    # Thumbor BuilderFactory configuration
    Thumbor\Url\BuilderFactory:
        arguments:
            $server: '%env(THUMBOR_SERVER_URL)%'
            $secret: '%env(THUMBOR_SECRET_KEY)%'

    # Orchestrator Processors (excluded directory, need explicit registration)
    App\Orchestrator\Processor\InsertedNewsProcessor:
        autowire: true
        autoconfigure: true

    App\Orchestrator\Processor\RecommendedEditorialsProcessor:
        autowire: true
        autoconfigure: true

    App\Orchestrator\Processor\MultimediaProcessor:
        autowire: true
        autoconfigure: true

    App\Orchestrator\Processor\MembershipLinksProcessor:
        autowire: true
        autoconfigure: true

    # Editorial Orchestrators
    App\Orchestrator\Chain\EditorialOrchestrator:
        autowire: true
        tags: ['app.orchestrators']

    App\Orchestrator\OrchestratorChainHandler:
        autowire: true
        autoconfigure: true

    App\Orchestrator\OrchestratorChain:
        autowire: true
        autoconfigure: true

    # Multimedia Orchestrators
    App\Orchestrator\Chain\Multimedia\MultimediaPhotoOrchestrator:
        autowire: true
        tags: ['app.multimedia.orchestrators']

    App\Orchestrator\Chain\Multimedia\MultimediaEmbedVideoOrchestrator:
        autowire: true
        tags: ['app.multimedia.orchestrators']

    App\Orchestrator\Chain\Multimedia\MultimediaWidgetOrchestrator:
        autowire: true
        tags: ['app.multimedia.orchestrators']

    App\Orchestrator\Chain\Multimedia\MultimediaOrchestratorHandler:
        autowire: true
        autoconfigure: true

    App\Orchestrator\Chain\Multimedia\MultimediaOrchestratorChain:
        autowire: true
        autoconfigure: true

    # Orchestrator Handlers (excluded directory, need explicit registration)
    App\Orchestrator\Handler\GenericChainHandler:
        autowire: true
        autoconfigure: true

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\EventSubscriber\ExceptionSubscriber:
        arguments:
            $appEnv: '%env(APP_ENV)%'
        tags: [ kernel.event_subscriber ]

    # Controllers
    App\Controller\V1\:
        resource: '../src/Controller/V1/'
        tags: [ 'controller.service_arguments' ]
        exclude:
            - '../src/Controller/V1/Schemas'

    App\EventHandler\PurgeEditorialHandler:
        class: App\EventHandler\PurgeEditorialHandler
        arguments:
            $hostname: '%env(APP_HOST)%'
        tags:
            - {name: 'messenger.message_handler', handles: 'Ec\Editorial\Domain\Model\EventEditorial', from_transport: snaapi}
